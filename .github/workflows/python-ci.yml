name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install quality tools
        run: uv sync --locked --only-group dev --no-install-project

      - name: Check lockfile
        run: uv lock --check

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check --diff .

      - name: Check import ordering
        run: uv run --no-sync isort . --check-only --diff

      - name: Check spelling
        run: >-
          uv run --no-sync codespell --toml pyproject.toml
          README.md CONTRIBUTING.md docs examples test hydrogym

  core:
    name: Core import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked core environment
        run: uv sync --locked --no-default-groups

      - name: Import core package
        run: uv run --no-sync python -c "import hydrogym; print(hydrogym.__all__)"

  two-phase-smoke:
    name: Two-phase unit + E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      PYTHONHASHSEED: "0"
      JAX_ENABLE_X64: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Install two-phase CPU dependencies
        run: uv sync --locked --no-default-groups --group dev --extra jaxfluids

      - name: Run two-phase unit tests
        run: >-
          uv run --no-sync pytest -q
          examples/two_phase/test_two_phase.py
          examples/two_phase/test_surrogate.py
          examples/two_phase/test_dataset_contract.py
          examples/two_phase/test_train_operator.py
          examples/two_phase/test_nonneutral_wetting_audit.py
          examples/two_phase/test_wall_measure.py
          examples/two_phase/test_cutcell_transport.py -m "not slow"
          examples/two_phase/test_cutcell_alignment_audit.py
          examples/two_phase/test_mass_precision.py
          examples/two_phase/test_krylov_roundoff.py
          examples/two_phase/test_phase_storage_precision.py
          examples/two_phase/test_restart.py
          examples/two_phase/test_a1_promotion_audit.py

      - name: Run the L1A-2g mass-precision audit (quick profile)
        working-directory: examples/two_phase
        env:
          JAX_ENABLE_X64: "1"
        run: >-
          uv run --no-sync python -m production.mass_precision_audit --profile quick
          --out artifacts/mass_precision_quick

      - name: Run the L1A-2h Krylov roundoff audit (quick profile)
        working-directory: examples/two_phase
        env:
          JAX_ENABLE_X64: "1"
        run: >-
          uv run --no-sync python -m production.krylov_roundoff_audit --profile quick
          --out artifacts/krylov_roundoff_quick
        # The audit exits 0 when its own integrity checks hold. The mass gates it reports are a
        # *finding*, not a smoke test: the quick gate is NOT met by contract-v10 arithmetic, and this
        # job must not be read as a claim that it is. See the report's Gates section.

      - name: Run the L1A-2i phase-state storage precision audit (quick profile)
        working-directory: examples/two_phase
        env:
          JAX_ENABLE_X64: "1"
        run: >-
          uv run --no-sync python -m production.phase_storage_precision_audit --profile quick
          --out artifacts/phase_storage_precision_quick
        # The audit exits 0 when its harness integrity holds. Whether a candidate clears the mass
        # gates is a *finding* of the run, printed in the report and in candidate_matrix.json; the
        # hosted job runs the quick profile only (spec 73) and never claims "all CI passed".

      - name: Run two-phase L1A validation contract
        working-directory: examples/two_phase
        run: |
          JAX_ENABLE_X64=1 uv run --no-sync pytest -q test_production_validation.py
          JAX_ENABLE_X64=1 uv run --no-sync python -m production.run_validation --config production/configs/ci.json --out artifacts/production_validation/ci --overwrite

      - name: Run Stage-2 A1 promotion audit (mandatory 2500-step quick reproduction)
        working-directory: examples/two_phase
        env:
          JAX_ENABLE_X64: "1"
        run: >-
          uv run --no-sync python -m production.a1_promotion_audit
          --out artifacts/l1a2i_stage2/promotion --overwrite

      - name: Run two-phase capillary sign audit
        working-directory: examples/two_phase
        run: uv run --no-sync python -m production.capillary_audit --json artifacts/production_validation/capillary_audit.json

      - name: Run two-phase wall wetting audit
        working-directory: examples/two_phase
        run: uv run --no-sync python -m production.wetting_audit --json artifacts/production_validation/wetting_audit.json

      - name: Run two-phase conservative phase-boundary audit
        working-directory: examples/two_phase
        run: >-
          uv run --no-sync python -m production.phase_boundary_audit --quick
          --json artifacts/production_validation/phase_boundary_audit.json

      - name: Run two-phase embedded wall-measure audit
        working-directory: examples/two_phase
        run: >-
          uv run --no-sync python -m production.wall_measure_audit --quick
          --json artifacts/production_validation/wall_measure_audit.json
          --markdown artifacts/production_validation/wall_measure_audit.md

      - name: Run two-phase L1A-2d quick equilibration audit
        working-directory: examples/two_phase
        run: >-
          uv run --no-sync python -m production.nonneutral_wetting_audit --profile quick
          --out artifacts/production_validation/l1a2d_quick --overwrite

      - name: Run two-phase cut-cell geometry audit
        working-directory: examples/two_phase
        run: >-
          env JAX_ENABLE_X64=1 uv run --no-sync python -m production.cutcell_geometry_audit --quick
          --out artifacts/production_validation/cutcell_geometry

      - name: Run two-phase cut-cell phase-transport audit
        working-directory: examples/two_phase
        run: >-
          env JAX_ENABLE_X64=1 uv run --no-sync python -m production.cutcell_phase_transport_audit --quick
          --out artifacts/production_validation/cutcell_phase_transport

      - name: Run two-phase L1A-2f alignment audit (quick profile)
        working-directory: examples/two_phase
        run: >-
          env JAX_ENABLE_X64=1 uv run --no-sync python -m production.cutcell_alignment_audit
          --profile quick --sections resolution,precision,laplace,impact,geometry,transport
          --allow-incomplete --out artifacts/production_validation/l1a2f_quick

      - name: Run two-phase L0 smoke
        run: uv run --no-sync bash examples/two_phase/run_smoke.sh

      - name: Upload two-phase smoke contracts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: two-phase-smoke-contracts
          if-no-files-found: ignore
          path: |
            examples/two_phase/artifacts/smoke/data/manifest.json
            examples/two_phase/artifacts/smoke/report.json
            examples/two_phase/artifacts/production_validation/ci/report.json
            examples/two_phase/artifacts/production_validation/capillary_audit.json
            examples/two_phase/artifacts/production_validation/wetting_audit.json
            examples/two_phase/artifacts/production_validation/phase_boundary_audit.json
            examples/two_phase/artifacts/production_validation/wall_measure_audit.json
            examples/two_phase/artifacts/production_validation/wall_measure_audit.md
            examples/two_phase/artifacts/production_validation/l1a2d_quick/nonneutral_equilibration_report.json
            examples/two_phase/artifacts/production_validation/cutcell_geometry/cutcell_geometry_audit.json
            examples/two_phase/artifacts/production_validation/cutcell_geometry/cutcell_geometry_audit.md
            examples/two_phase/artifacts/production_validation/cutcell_phase_transport/cutcell_phase_transport_audit.json
            examples/two_phase/artifacts/production_validation/cutcell_phase_transport/cutcell_phase_transport_audit.md
            examples/two_phase/artifacts/production_validation/l1a2f_quick/cutcell_alignment_report.json
            examples/two_phase/artifacts/production_validation/l1a2f_quick/cutcell_alignment_report.md
            examples/two_phase/artifacts/production_validation/l1a2f_quick/manifest.json

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Verify distribution contents and metadata
        run: python scripts/verify_distribution.py dist

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl -- python -c "import hydrogym"

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz -- python -c "import hydrogym"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
